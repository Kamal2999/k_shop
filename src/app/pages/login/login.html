<div class="login-box">

    <h1>Login</h1>
  
    <input
      type="text"
      placeholder="Enter User ID"
      [(ngModel)]="user_id"
    >
  
    <input
      type="password"
      placeholder="Enter Password"
      [(ngModel)]="password"
    >
  
    <button (click)="login()">
      Login
    </button>
  
  </div>
